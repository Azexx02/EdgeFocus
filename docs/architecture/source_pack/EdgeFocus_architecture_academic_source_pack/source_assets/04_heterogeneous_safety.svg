t><text text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><tspan x="1310.0" y="513.375" font-size="15" font-weight="700" fill="#1B1F24">双轴云台 + AS5600</tspan></text><text x="600.0" y="510.352" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12.8" font-weight="600" fill="#1B1F24" opacity="1.0">Home ≈ 4 FPS · Go ≈ 3 FPS</text><text text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><tspan x="290.0" y="693.1125" font-size="18" font-weight="700" fill="#1B1F24">本地安全闭环</tspan><tspan x="290.0" y="715.6125" font-size="12.5" font-weight="400" fill="#343A40">100 ms 温度策略 + PWM / tach</tspan><tspan x="290.0" y="731.2375" font-size="12.5" font-weight="400" fill="#343A40">A35 &gt; 3 s 失联 → 安全高转</tspan><tspan x="290.0" y="746.8625" font-size="12.5" font-weight="400" fill="#343A40">fallback 前 remoteproc offline，禁止双控制者</tspan></text><text x="207.5" y="814.08" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#1B1F24" opacity="1.0">100 ms</text><text x="372.5" y="814.08" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#1B1F24" opacity="1.0">1 Hz / 3 s</text><text text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><tspan x="800.0" y="693.1125" font-size="18" font-weight="700" fill="#1B1F24">Fault 就地收敛</tspan><tspan x="800.0" y="715.6125" font-size="12.5" font-weight="400" fill="#343A40">G431 本地先停驱动；A35 撤销 PD7</tspan><tspan x="800.0" y="731.2375" font-size="12.5" font-weight="400" fill="#343A40">固定相机视觉继续；恢复后重新对齐</tspan><tspan x="800.0" y="746.8625" font-size="12.5" font-weight="400" fill="#343A40">机械限位 · 死区 · 速率限制</tspan></text><text x="717.5" y="814.08" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#1B1F24" opacity="1.0">Local Fault</text><text x="882.5" y="814.08" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#1B1F24" opacity="1.0">固定相机降级</text><text text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif"><tspan x="1310.0" y="687.05" font-size="18" font-weight="700" fill="#1B1F24">资源与降级策略</tspan><tspan x="1310.0" y="709.55" font-size="11.8" font-weight="400" fill="#343A40">External Power UNKNOWN → Go</tspan><tspan x="1310.0" y="724.3" font-size="11.8" font-weight="400" fill="#343A40">Home / Go 只改变视觉节拍；BLE / Fault / 安全环不降频</tspan><tspan x="1310.0" y="739.05" font-size="11.8" font-weight="400" fill="#343A40">Formal Session &gt; Demo；Camera / NPU 单一 ResourceLease</tspan><tspan x="1310.0" y="753.8" font-size="11.8" font-weight="400" fill="#343A40">Camera / NPU 异常 → 视觉 UNKNOWN，Phone 分支继续</tspan></text><text x="1227.5" y="824.08" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#1B1F24" opacity="1.0">3 × 250 ms</text><text x="1392.5" y="824.08" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="12" font-weight="600" fill="#1B1F24" opacity="1.0">Formal &gt; Demo</text><text x="800" y="862" text-anchor="middle" font-family="'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif" font-size="10.5" font-weight="700" fill="#7A828A" opacity="1.0">故障只关闭局部能力，不扩大为全系统停机</text></svg>