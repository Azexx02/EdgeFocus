<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnStart = document.getElementById('btn-start');
            const btnPause = document.getElementById('btn-pause');
            const btnStop = document.getElementById('btn-stop');
            const activeControls = document.getElementById('active-controls');
            
            const timerContainer = document.getElementById('timer-container');
            const timeDisplay = document.getElementById('time-display');
            const timeHint = document.getElementById('time-hint');
            
            const progressRing = document.getElementById('progress-ring');
            const sliderSvg = document.getElementById('slider-svg');
            const sliderHandle = document.getElementById('slider-handle');
            
            let state = 'IDLE'; // IDLE, RUNNING, PAUSED
            let totalTime = 25 * 60; // Max time user set
            let timeLeft = totalTime;
            let timerInterval;
            
            const MAX_MINUTES = 120;
            const CIRCUMFERENCE = 2 * Math.PI * 46; // r=46
            progressRing.style.strokeDasharray = CIRCUMFERENCE;

            // --- Slider Logic ---
            let isDragging = false;

            function getAngle(e) {
                const rect = sliderSvg.getBoundingClientRect();
                // Get center of SVG
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                // Get pointer position (mouse or touch)
                let clientX = e.clientX;
                let clientY = e.clientY;
                if(e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                // Calculate angle in radians
                // We subtract Math.PI/2 because our SVG is rotated -90deg in CSS to start at 12 o'clock
                // But the mouse coordinates are based on screen, so standard atan2 works from 3 o'clock.
                // Because we rotated the SVG container visually, we need to calculate based on screen coords
                // and then map that 0 to 360 starting from top.
                
                let dx = clientX - centerX;
                let dy = clientY - centerY;
                
                // Angle from top (12 o'clock) clockwise
                let theta = Math.atan2(dy, dx) + Math.PI / 2;
                if (theta < 0) theta += 2 * Math.PI;
                
                return theta;
            }

            function updateSliderFromAngle(theta) {
                // Map 0 - 2PI to 1 - MAX_MINUTES
                let fraction = theta / (2 * Math.PI);
                let minutes = Math.max(1, Math.round(fraction * MAX_MINUTES));
                
                if (minutes > MAX_MINUTES) minutes = MAX_MINUTES;
                
                // Snap to nearest 5 minutes if over 10 to make it easier to set common times
                if (minutes > 10 && !isDragging) {
                     // don't snap while dragging for smoother feel, snap on release if desired.
                     // Actually, let's just let it be exact.
                }

                totalTime = minutes * 60;
                timeLeft = totalTime;
                updateDisplay();
                updateVisuals();
            }

            function handlePointerStart(e) {
                if (state !== 'IDLE') return; // Only allow setting time when idle
                isDragging = true;
                sliderHandle.classList.add('handle-active');
                updateSliderFromEvent(e);
                e.preventDefault(); // Prevent scrolling while dragging
            }

            function handlePointerMove(e) {
                if (!isDragging) return;
                updateSliderFromEvent(e);
                e.preventDefault();
            }

            function handlePointerEnd(e) {
                isDragging = false;
                sliderHandle.classList.remove('handle-active');
            }

            function updateSliderFromEvent(e) {
                const theta = getAngle(e);
                updateSliderFromAngle(theta);
            }

            // Attach slider events
            sliderSvg.addEventListener('mousedown', handlePointerStart);
            document.addEventListener('mousemove', handlePointerMove);
            document.addEventListener('mouseup', handlePointerEnd);
            
            sliderSvg.addEventListener('touchstart', handlePointerStart, {passive: false});
            document.addEventListener('touchmove', handlePointerMove, {passive: false});
            document.addEventListener('touchend', handlePointerEnd);

            // --- Timer Logic ---
            function updateDisplay() {
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timeDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }

            function updateVisuals() {
                // Update Progress Ring
                let fraction = timeLeft / (MAX_MINUTES * 60);
                // The fraction of the total possible 120 mins
                // Actually, standard pomodoro usually fills the ring for the *set* time.
                // Let's make the ring fill represent the fraction of the *set* time remaining, 
                // BUT the handle position represents the absolute time out of 120 mins.
                // For a cooler effect: The ring shows fraction of 120 mins so the handle stays attached to the end of the stroke!
                
                const offset = CIRCUMFERENCE - (fraction * CIRCUMFERENCE);
                progressRing.style.strokeDashoffset = offset;

                // Update Handle Position
                // SVG internal coordinates: center is 50,50, radius is 46
                // Angle needs to match the visual rotation
                let angle = fraction * 2 * Math.PI; 
                let cx = 50 + 46 * Math.sin(angle);
                let cy = 50 - 46 * Math.cos(angle);
                
                // The SVG is rotated -90deg in CSS, so internal 0deg (top) is visually top.
                // In standard SVG math without rotation, sin/cos from top:
                // x = cx + r * cos(theta), y = cy + r * sin(theta)
                // Since container is rotated -90, (96, 50) which is 3 o'clock internally becomes 12 o'clock visually.
                // Wait, if it's rotated -90, 3 o'clock goes to 12.
                // Internal coords: 
                // theta = fraction * 2PI. 
                // x = 50 + 46 * Math.cos(theta);
                // y = 50 + 46 * Math.sin(theta);
                
                let internalTheta = angle; 
                let handleX = 50 + 46 * Math.cos(internalTheta);
                let handleY = 50 + 46 * Math.sin(internalTheta);
                
                const handleCircle = sliderHandle.querySelector('circle');
                handleCircle.setAttribute('cx', handleX);
                handleCircle.setAttribute('cy', handleY);
            }

            function setInitialVisuals() {
                // 25 mins out of 120
                updateVisuals();
            }

            function startTimer() {
                if (timeLeft <= 0) return;
                state = 'RUNNING';
                timerContainer.classList.add('timer-running');
                
                // UI changes
                btnStart.classList.add('hidden');
                activeControls.classList.remove('hidden');
                btnPause.innerHTML = `<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pause</span> Pause`;
                timeHint.style.opacity = '0';
                
                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        updateDisplay();
                        updateVisuals();
                    } else {
                        stopTimer();
                        alert('Session Complete!');
                    }
                }, 1000);
            }

            function pauseTimer() {
                if (state === 'RUNNING') {
                    state = 'PAUSED';
                    clearInterval(timerInterval);
                    timerContainer.classList.remove('timer-running');
                    btnPause.innerHTML = `<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span> Resume`;
                } else if (state === 'PAUSED') {
                    startTimer();
                }
            }

            function stopTimer() {
                state = 'IDLE';
                clearInterval(timerInterval);
                timerContainer.classList.remove('timer-running');
                
                btnStart.classList.remove('hidden');
                activeControls.classList.add('hidden');
                timeHint.style.opacity = '1';
                
                timeLeft = totalTime;
                updateDisplay();
                updateVisuals();
            }

            btnStart.addEventListener('click', startTimer);
            btnPause.addEventListener('click', pauseTimer);
            btnStop.addEventListener('click', stopTimer);

            // Init
            updateDisplay();
            setInitialVisuals();
        });
    </script>
