<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EdgeFocus - Data Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#006e1c",
                        "surface-variant": "#e4e2e0",
                        "surface": "#fbf9f7",
                        "on-surface-variant": "#5b403e",
                        "on-primary-container": "#fffbff",
                        "error": "#ba1a1a",
                        "surface-tint": "#b81d27",
                        "tertiary-fixed": "#ffddb4",
                        "outline-variant": "#e3bebb",
                        "background": "#fbf9f7",
                        "on-tertiary-fixed-variant": "#633f00",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "on-surface": "#1b1c1b",
                        "secondary-container": "#91f78e",
                        "surface-bright": "#fbf9f7",
                        "on-tertiary-container": "#fffbff",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#78dc77",
                        "primary-container": "#d8363a",
                        "surface-dim": "#dbdad8",
                        "primary-fixed-dim": "#ffb3ae",
                        "on-secondary-container": "#00731e",
                        "surface-container-high": "#e9e8e6",
                        "on-background": "#1b1c1b",
                        "on-tertiary-fixed": "#291800",
                        "primary-fixed": "#ffdad7",
                        "primary": "#b51925",
                        "tertiary": "#805200",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#930015",
                        "inverse-primary": "#ffb3ae",
                        "surface-container-low": "#f5f3f1",
                        "tertiary-fixed-dim": "#ffb954",
                        "on-primary-fixed": "#410004",
                        "on-secondary-fixed-variant": "#005313",
                        "on-error-container": "#93000a",
                        "surface-container": "#efedec",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#002204",
                        "tertiary-container": "#a06900",
                        "inverse-on-surface": "#f2f0ee",
                        "surface-container-highest": "#e4e2e0",
                        "secondary-fixed": "#94f990",
                        "outline": "#8f706d",
                        "inverse-surface": "#30302f"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-desktop": "48px",
                        "section-margin": "40px",
                        "container-padding-mobile": "24px",
                        "unit": "8px",
                        "card-padding": "24px",
                        "stack-gap": "16px"
                    },
                    "fontFamily": {
                        "label-sm": ["Quicksand"],
                        "label-md": ["Quicksand"],
                        "headline-lg": ["Quicksand"],
                        "headline-lg-mobile": ["Quicksand"],
                        "body-md": ["Quicksand"],
                        "headline-md": ["Quicksand"],
                        "body-lg": ["Quicksand"],
                        "display-timer": ["Quicksand"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "500" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "display-timer": ["80px", { "lineHeight": "90px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            /* Landscape constraints */
            max-width: 896px;
            max-height: 428px;
            margin: auto;
            overflow: hidden;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            box-shadow: 0 0 40px rgba(0,0,0,0.05);
            /* Center vertically on larger screens */
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            border-radius: 1.5rem;
        }
        .card-shadow {
            box-shadow: 0 10px 30px -5px rgba(181, 25, 37, 0.08);
        }
    </style>
</head>
<body class="bg-background flex flex-col font-body-md text-on-background relative">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-background z-50">
<div class="flex justify-between items-center px-8 py-3 w-full">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined hover:opacity-80 transition-opacity cursor-pointer active:scale-95 duration-200 ease-[cubic-bezier(0.34,1.56,0.64,1)]">timer</span>
</div>
<div class="flex flex-col items-center">
<h1 class="font-headline-lg-mobile text-headline-md text-primary tracking-tight">EdgeFocus</h1>
<div class="bg-surface-variant text-on-surface-variant px-3 py-1 rounded-full font-label-sm text-label-sm mt-1">Data Analysis</div>
</div>
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined hover:opacity-80 transition-opacity cursor-pointer active:scale-95 duration-200 ease-[cubic-bezier(0.34,1.56,0.64,1)]">bluetooth_connected</span>
</div>
</div>
</header>
<main class="flex-1 overflow-hidden relative px-12 py-2">
<div class="flex flex-row gap-8 w-full h-full max-w-4xl mx-auto items-center pb-4">
<!-- Left Side: Chart Section -->
<section class="flex-1 h-[280px] bg-surface-container-lowest rounded-2xl p-6 card-shadow flex flex-col relative overflow-hidden group">
<div class="flex justify-between items-center mb-6">
<h2 class="font-headline-md text-headline-md text-on-surface">Focus Activity</h2>
<div class="flex space-x-2">
<button class="font-label-md text-label-md bg-primary text-on-primary px-4 py-2 rounded-full shadow-md transform transition-transform active:scale-95 duration-200">7 Days</button>
<button class="font-label-md text-label-md bg-surface text-on-surface-variant px-4 py-2 rounded-full hover:bg-surface-variant/50 transition-colors">30 Days</button>
</div>
</div>
<!-- Stylized CSS Bar Chart -->
<div class="flex-grow flex items-end justify-between space-x-4 px-4 pb-2 h-full">
<!-- Day 1 -->
<div class="w-full flex flex-col items-center justify-end h-full group/bar cursor-pointer">
<div class="w-full bg-surface-variant rounded-t-full relative overflow-hidden transition-all duration-300 group-hover/bar:bg-primary-fixed-dim" style="height: 40%;">
<div class="absolute bottom-0 w-full bg-primary rounded-t-full transition-all duration-500" style="height: 100%;"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2">Mon</span>
</div>
<!-- Day 2 -->
<div class="w-full flex flex-col items-center justify-end h-full group/bar cursor-pointer">
<div class="w-full bg-surface-variant rounded-t-full relative overflow-hidden transition-all duration-300 group-hover/bar:bg-primary-fixed-dim" style="height: 60%;">
<div class="absolute bottom-0 w-full bg-primary rounded-t-full transition-all duration-500" style="height: 100%;"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2">Tue</span>
</div>
<!-- Day 3 -->
<div class="w-full flex flex-col items-center justify-end h-full group/bar cursor-pointer">
<div class="w-full bg-surface-variant rounded-t-full relative overflow-hidden transition-all duration-300 group-hover/bar:bg-primary-fixed-dim" style="height: 30%;">
<div class="absolute bottom-0 w-full bg-primary rounded-t-full transition-all duration-500" style="height: 100%;"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2">Wed</span>
</div>
<!-- Day 4 -->
<div class="w-full flex flex-col items-center justify-end h-full group/bar cursor-pointer">
<div class="w-full bg-surface-variant rounded-t-full relative overflow-hidden transition-all duration-300 group-hover/bar:bg-primary-fixed-dim" style="height: 85%;">
<div class="absolute bottom-0 w-full bg-primary rounded-t-full transition-all duration-500" style="height: 100%;"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2 text-primary">Thu</span>
</div>
<!-- Day 5 -->
<div class="w-full flex flex-col items-center justify-end h-full group/bar cursor-pointer">
<div class="w-full bg-surface-variant rounded-t-full relative overflow-hidden transition-all duration-300 group-hover/bar:bg-primary-fixed-dim" style="height: 50%;">
<div class="absolute bottom-0 w-full bg-primary rounded-t-full transition-all duration-500" style="height: 100%;"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2">Fri</span>
</div>
<!-- Day 6 -->
<div class="w-full flex flex-col items-center justify-end h-full group/bar cursor-pointer">
<div class="w-full bg-surface-variant rounded-t-full relative overflow-hidden transition-all duration-300 group-hover/bar:bg-primary-fixed-dim" style="height: 20%;">
<div class="absolute bottom-0 w-full bg-primary rounded-t-full opacity-50 transition-all duration-500" style="height: 100%;"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2">Sat</span>
</div>
<!-- Day 7 -->
<div class="w-full flex flex-col items-center justify-end h-full group/bar cursor-pointer">
<div class="w-full bg-surface-variant rounded-t-full relative overflow-hidden transition-all duration-300 group-hover/bar:bg-primary-fixed-dim" style="height: 10%;">
<div class="absolute bottom-0 w-full bg-primary rounded-t-full opacity-50 transition-all duration-500" style="height: 100%;"></div>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-2">Sun</span>
</div>
</div>
<!-- Decorative background element -->
<div class="absolute -bottom-10 -right-10 w-48 h-48 bg-primary-fixed rounded-full blur-3xl opacity-20 pointer-events-none"></div>
</section>
<!-- Right Side: Stats Cards -->
<section class="flex flex-col space-y-4 w-1/3 h-[280px] justify-between">
<!-- Stat Card 1 -->
<div class="bg-surface-container-lowest rounded-2xl p-4 flex items-center justify-between card-shadow border border-surface-variant/30 hover:scale-[1.02] transition-transform duration-300 cursor-default h-[85px]">
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-1">Total Focus</p>
<p class="font-headline-lg text-headline-md text-on-surface">12.5h</p>
</div>
<div class="w-10 h-10 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">timer</span>
</div>
</div>
<!-- Stat Card 2 -->
<div class="bg-surface-container-lowest rounded-2xl p-4 flex items-center justify-between card-shadow border border-surface-variant/30 hover:scale-[1.02] transition-transform duration-300 cursor-default h-[85px]">
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-1">Today</p>
<p class="font-headline-lg text-headline-md text-on-surface text-primary">45m</p>
</div>
<div class="w-10 h-10 rounded-full bg-tertiary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">today</span>
</div>
</div>
<!-- Stat Card 3 -->
<div class="bg-surface-container-lowest rounded-2xl p-4 flex items-center justify-between card-shadow border border-surface-variant/30 hover:scale-[1.02] transition-transform duration-300 cursor-default h-[85px]">
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-1">Efficiency</p>
<p class="font-headline-lg text-headline-md text-secondary">88%</p>
</div>
<div class="w-10 h-10 rounded-full bg-secondary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Indicator Bar -->
<footer class="w-full bg-background pb-4 pt-2 flex justify-between items-center px-12">
<div class="w-20"></div> <!-- Spacer for centering -->
<!-- Pager Dots -->
<div class="flex gap-3">
<div class="w-2.5 h-2.5 rounded-full bg-surface-variant transition-all duration-300 hover:bg-surface-dim cursor-pointer"></div>
<div class="w-2.5 h-2.5 rounded-full bg-primary transition-all duration-300"></div>
<div class="w-2.5 h-2.5 rounded-full bg-surface-variant transition-all duration-300 hover:bg-surface-dim cursor-pointer"></div>
</div>
<!-- BLE Status -->
<div class="w-20 flex justify-end items-center gap-2 text-secondary font-label-sm text-label-sm">
<span class="relative flex h-2.5 w-2.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-secondary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-secondary"></span>
</span>
            BLE Sync
        </div>
</footer>
</body></html>
